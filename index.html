<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure PDF Launcher</title>
    
    <!-- iOS Web App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PDF App">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 480px; text-align: center; }
        h1 { font-size: 1.6rem; color: #1a1f2c; margin-bottom: 8px; }
        p { font-size: 0.95rem; color: #64748b; margin-bottom: 24px; line-height: 1.4; }
        .input-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 20px; }
        label { font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="url"] { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="url"]:focus { border-color: #3b82f6; }
        button { width: 100%; background-color: #3b82f6; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #2563eb; }
        .error { color: #dc2626; font-size: 0.85rem; margin-top: 6px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Secure PDF Hub</h1>
        <p>Enter a PDF web address below to lock it into your full-screen app viewer interface.</p>
        
        <form id="launcher-form">
            <div class="input-group">
                <label for="pdf-url">PDF File Web Link</label>
                <input type="url" id="pdf-url" placeholder="https://example.com" required autocomplete="off">
                <div id="error-msg" class="error">Please enter a valid web link pointing to a .pdf file.</div>
            </div>
            <button type="submit">Launch PDF Viewer</button>
        </form>
    </div>

    <script>
        document.getElementById('launcher-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const urlInput = document.getElementById('pdf-url').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            // Basic structural validation check to ensure it looks like a web URL
            if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                errorMsg.innerText = "URL must start with http:// or https://";
                errorMsg.style.display = 'block';
                return;
            }
            
            errorMsg.style.display = 'none';
            
            // URL encode the parameter string to protect special layout characters
            const encodedUrl = encodeURIComponent(urlInput);
            
            // Redirect smoothly to your subfolder asset viewer layout page
            window.location.href = `/pdf/index.html?url=${encodedUrl}`;
        });
    </script>
</body>
</html>
