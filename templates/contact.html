<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Arqade</title>
    <style>
        body {
            background-color: #f9fafb;
            color: #2d3748;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 32rem;
            margin: 0 auto;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h1 { color: #111827; margin-top: 0; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.875rem; color: #374151; }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        textarea { resize: vertical; min-height: 120px; }
        .submit-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.375rem;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover { background-color: #4338ca; }
        .nav-link { color: #4f46e5; text-decoration: none; font-size: 0.875rem; display: inline-block; margin-top: 1.5rem; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>Contact Us</h1>

    <!-- FIXED: The routing path now explicitly contains your destination address -->
    <form action="https://formsubmit.co/a4749e300494718c2b55fa7cd0c4ac01" method="POST">
        
        <!-- Setting configurations for the FormSubmit processing layout -->
        <input type="hidden" name="_subject" value="From Arqade Website">
        <input type="hidden" name="_captcha" value="true">
        <input type="hidden" name="_next" value="https://arqadetv-github-io.onrender.com/contact">

        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="Name" required placeholder="Your name">
        </div>

        <div class="form-group">
            <label for="email">Email Address (Optional)</label>
            <input type="email" id="email" name="Email" placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label for="subject">Subject *</label>
            <input type="text" id="subject" name="Subject" required placeholder="What is this regarding?">
        </div>

        <div class="form-group">
            <label for="message">Body *</label>
            <textarea id="message" name="Body" required placeholder="Type your message here..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
    </form>

    <a href="{{ url_for('home') }}" class="nav-link">← Back to Home</a>
</div>

</body>
</html>
